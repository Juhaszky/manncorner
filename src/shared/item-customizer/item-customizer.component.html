<div
  class="customizer flex flex-col h-full w-full bg-slate-800 text-slate-300 p-4"
>
  <form
    class="flex flex-col flex-wrap items-center"
    [formGroup]="itemFormGroup"
    (submit)="onSubmit()"
  >
    <div class="name flex flex-col items-center justify-between">
      <h2>Name</h2>
      <h3>{{ itemFormGroup.controls["quality"].value.join(' ') }} {{ details.name }}</h3>
    </div>
    <div
      class="name flex flex-col items-center sm:w-1/2 w-full flex-wrap justify-between p-4"
    >
      <mat-accordion [style.color]="'red'">
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title class="text-slate-300"> Quality </mat-panel-title>
            <mat-panel-description>
              You can select item's quality
            </mat-panel-description>
          </mat-expansion-panel-header>
          <item-quality [qualityControl]="itemFormGroup.controls['quality']" (selectionChange)="onQualitySelectionChange($event)"></item-quality>
        </mat-expansion-panel>
      </mat-accordion>
    </div>
    <button
      class="border rounded-md text-slate-300 p-4 hover:bg-slate-900"
      type="submit"
    >
      Modify
    </button>
  </form>
</div>
