<div
  class="customizer flex flex-col h-full w-full bg-slate-800 text-slate-300 p-4"
>
  <form
    class="flex flex-col flex-wrap items-center"
    [formGroup]="itemFormGroup"
    (submit)="onSubmit()"
  >
    <div class="name flex flex-col items-center justify-between">
      <h2>Name</h2>
      <h3>{{ itemFormGroup.controls["quality"].value }} {{ details.name }}</h3>
    </div>
    <div
      class="name flex flex-col items-center sm:w-1/2 w-full flex-wrap justify-between p-4"
    >
      <h2>Quality</h2>
      <mat-chip-listbox
        formControlName="quality"
        multiple="true"
        class="mat-mdc-chip-set-stacked sm:w-1/2 w-full"
        aria-label="Color selection"
      >
        @for (quality of qualities; track quality) {
        <mat-chip-option
          [selected]="initDefaultValues(quality.type)"
          [ngClass]="getQualityClass(quality.type)"
          class="text-slate-300 w-full"
          >{{ quality.type }}</mat-chip-option
        >
        }
      </mat-chip-listbox>
    </div>
    <button
      class="border rounded-md text-slate-300 p-4 hover:bg-slate-900"
      type="submit"
    >
      Modify
    </button>
  </form>
</div>
