<div class="relative w-25 h-25 flex flex-col items-center justify-center p-4">
    @if (item.effect) {
      <img
        [src]="`assets/images/effects/${item.effect}.png`"
        alt="Effect"
        class="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none" />
    }

    @if (item) {
    <resized-image [imageUrl]="item.img" class="relative z-10"
        style="max-width: 100%; max-height: 100%"></resized-image>
    <div class="name flex flex-col items-center justify-between">
        <h4>Level - {{item.level}}</h4>
        <h3>
            {{getQualityString(item.quality)}}
            {{ getkillStreakString(item.killstreak ?? -1 ) }}
            {{ item.isAustralium ? 'Australium ' : '' }}
            {{item.fullName}}
        </h3>
        <div class="flex flex-row w-full justify-between mt-4">
            <p-button (click)="openBackpackTfLink()">Backpack.tf</p-button>
            @if (item.isSelling || item.commentId) {
              <p-button (onClick)="openBackpackTfHistory()" pTooltip="Item history" tooltipPosition="bottom" severity="secondary">
                <img class="h-6 w-6" src="/assets/icons/history.svg" alt="" />
              </p-button>
            }
        </div>
    </div>
    }
</div>
