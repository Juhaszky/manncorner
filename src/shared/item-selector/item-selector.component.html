<div class="col-card inventory-box flex flex-wrap flex-row relative w-full h-full" #inventorySelector
  [class.justify-center]="mode !== 'allItems'">
  <div *ngIf="mode === 'allItems'" class="item-box p-2 m-2 sm:h-24 sm:w-24 h-20 w-20 border border-slate-700"
    matTooltip="Add items..." (click)="onOpenItemEditor()" tabindex="1" (keydown)="onOpenItemEditor()">
    <img src="/assets/images/8333955.png" alt="" class="img-fluid" />
  </div>
  <div class="grid grid-cols-7 gap-2 p-2 w-full">
    <div *ngFor="let item of items">
      <app-item-container 
        [item]="item" 
        [mode]="mode" 
        (click)="onItemSelect(item)">
      </app-item-container>
    </div>
  </div>
</div>
