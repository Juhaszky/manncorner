<div
  class="col-card inventory-box flex flex-wrap flex-row relative w-full h-full"
  [class.justify-center]="mode !== 'allItems'">
  <div
    *ngIf="mode === 'allItems'"
    class="item-box p-2 m-2 sm:h-24 sm:w-24 h-20 w-20 border border-slate-700"
    matTooltip="Add items..."
    (click)="onOpenItemEditor()">
    <img src="/assets/images/8333955.png" alt="" class="img-fluid" />
  </div>

  <p-virtualscroller
  [items]="mode==='toTrade' ? items : chunkedItems"
  [itemSize]="getItemSize()"
  [showLoader]="true"
  [delay]="50"
  class="w-full h-full flex-grow"
  [style]="{ width: '100%', height: '100%' }">
  
  <ng-template #item let-row let-options="options">
    <div 
      class="grid gap-2 p-2 w-full"
      [style]="{ 
        display: 'grid', 
        gridTemplateColumns: 'repeat(7, 1fr)' 
      }">
      
      <ng-container *ngFor="let item of row trackBy: trackByFn">
        <app-item-container
          class="w-full flex justify-center"
          [item]="item"
          [mode]="mode"
          (click)="onItemSelect(item)"
          (removeEmitter)="onRemoveItem(options.index)">
        </app-item-container>
      </ng-container>

    </div>
  </ng-template>
  <ng-template #loader let-options="options">
    <div class="flex flex-col items-center" [ngClass]="{ 'surface-ground': options.odd }">
      <div 
      class="grid items-center gap-2 p-2 w-full"
      [style]="{ 
        display: 'grid', 
        gridTemplateColumns: 'repeat(7, 1fr)' 
      }">
  
  <div class="flex items-center justify-center px-2" style="height: 25px">
    <p-skeleton width="50%" height="1.2rem"></p-skeleton>
  </div>
  <div class="flex items-center px-2" style="height: 25px"><p-skeleton width="60%" height="1.2rem"></p-skeleton></div>
  <div class="flex items-center px-2" style="height: 25px"><p-skeleton width="50%" height="1.2rem"></p-skeleton></div>
  <div class="flex items-center px-2" style="height: 25px"><p-skeleton width="60%" height="1.2rem"></p-skeleton></div>
  <div class="flex items-center px-2" style="height: 25px"><p-skeleton width="50%" height="1.2rem"></p-skeleton></div>
  <div class="flex items-center px-2" style="height: 25px"><p-skeleton width="60%" height="1.2rem"></p-skeleton></div>

    </div>
        
    </div>
</ng-template>
</p-virtualscroller>


</div>
