<app-item 
    [itemData]="item" 
    [itemImgUrl]="item.img"
    [effectUrl]="item.effect ? `assets/images/effects/${item.effect}.png` : null"
    [mode]="mode"
    [disabled]="disabled"
    [borderStyle]="facade.getBorderStyle(item)"
    (selectEmitter)="itemSelectorFacade.onAddItem(item)"
    (removeEmitter)="itemSelectorFacade.onRemoveItem(item)">
</app-item>
