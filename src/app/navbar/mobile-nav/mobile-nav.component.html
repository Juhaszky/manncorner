<p-drawer [(visible)]="isDrawerOpen" [modal]="true" [dismissible]="true" position="left" class="bg-white border-gray-200 py-2.5 dark:bg-gray-900 h-screen">
  <!-- Drawer Header -->
  <ng-template #header>
    <div class="flex items-center gap-2">
      <a routerLink="/home" class="flex items-center">
        <span
          class="self-center text-xl font-semibold whitespace-nowrap dark:text-white"
          >Mann<span id="titleEnding">corner</span></span
        >
      </a>
    </div>
  </ng-template>

  <!-- Navigation Links -->
  <ul class="flex flex-col mt-4 font-medium">
    <li>
      <a
        routerLink="/home"
        routerLinkActive="active-route dark:text-white dark:hover:bg-green-700"
        class="block py-2 pl-3 pr-4 text-gray-700 border-b border-gray-100 hover:bg-gray-50 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:border-gray-700"
        >Home</a
      >
    </li>
    <li>
      <a
        routerLink="/dashboard"
        routerLinkActive="active-route dark:text-white dark:hover:bg-green-700"
        class="block py-2 pl-3 pr-4 text-gray-700 border-b border-gray-100 hover:bg-gray-50 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:border-gray-700"
        >Dashboard</a
      >
    </li>
    <li>
      <a
        routerLink="/contact"
        routerLinkActive="active-route dark:text-white dark:hover:bg-green-700"
        class="block py-2 pl-3 pr-4 text-gray-700 border-b border-gray-100 hover:bg-gray-50 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:border-gray-700"
        >Contact</a
      >
    </li>
    <li>
      <a
        routerLink="add-trade"
        routerLinkActive="active-route dark:text-white dark:hover:bg-green-700"
        class="block py-2 pl-3 pr-4 text-gray-700 border-b border-gray-100 hover:bg-gray-50 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:border-gray-700"
        >Add trade +</a
      >
    </li>
     <li *ngIf="!isLoggedIn">
          <a href="http://localhost:5268/auth/Login" routerLinkActive="dark:text-white" 
             class="block py-2 pl-3 pr-4 text-gray-700 border-b border-gray-100 hover:bg-gray-50 
                    lg:hover:bg-transparent lg:border-0 lg:hover:text-purple-700 lg:p-0 
                    dark:text-gray-400 lg:dark:hover:text-white dark:hover:bg-gray-700 
                    dark:hover:text-white lg:dark:hover:bg-transparent dark:border-gray-700">
            <img src="/assets/steam_login_btn.png" alt="">
          </a>
      </li>
      <li *ngIf="isLoggedIn" class="flex justify-center gap-2">
          <button (click)="handleLogout()" class="block py-2 pl-3 pr-4 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-purple-700 lg:p-0 dark:text-gray-400 lg:dark:hover:text-white dark:hover:bg-gray-700 dark:hover:text-white lg:dark:hover:bg-transparent dark:border-gray-700">Logout</button>
          <button><i><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></i></button>
        </li>
        <li>

          <div>
            <app-user-data ></app-user-data>
          </div>
        </li>
  </ul>

  <!-- Drawer Footer -->
  <!-- <ng-template #footer>
    <div class="flex items-center gap-2">
      <button pButton label="Account" icon="pi pi-user" class="w-full" outlined></button>
      <button pButton label="Logout" icon="pi pi-sign-out" class="w-full" severity="danger" text></button>
    </div>
  </ng-template> -->
</p-drawer>
