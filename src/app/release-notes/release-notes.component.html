<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 lg:py-16 max-w-7xl">
  <div class="text-center mb-12 sm:mb-16 lg:mb-20">
    <h1 class="release-title mb-6 sm:mb-8 text-3xl sm:text-4xl lg:text-5xl xl:text-6xl">
      Release Notes & <span id="titleEnding" >Features</span>
    </h1>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6 sm:gap-8 lg:gap-12"> 
    @for (feature of features; track feature.title) { 
        <p-card class="
                  !bg-gradient-to-br !from-emerald-50/95 !via-white/98 !to-blue-50/90 !backdrop-blur-md !border
                  !border-emerald-100/70 !shadow-md hover:shadow-2xl hover:!bg-gradient-to-br hover:!from-emerald-100/90 
                  hover:!via-white/100 hover:!to-blue-100/80 hover:-translate-y-3 hover:ring-4 hover:ring-emerald-200/50 
                  transition-all duration-500 transform group h-full rounded-3xl"
        > 
          <ng-template pTemplate="header"> 
            <div class="flex items-center gap-4 mb-6 p-2 -m-2"> 
              <div class="w-16 h-16 bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl flex items-center
                     justify-center flex-shrink-0 shadow-xl group-hover:shadow-2xl group-hover:scale-110 group-hover:ring-2 
                     group-hover:ring-white/50 transition-all duration-300"
              > 
                <i class="{{feature.icon}} text-2xl text-white drop-shadow-md"></i> 
              </div> 
              <h3 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-gray-900 via-emerald-800 to-teal-700
                    bg-clip-text text-transparent group-hover:scale-105 transition-transform"
              >
                {{feature.title}}
              </h3> 
            </div> 
          </ng-template> 
          <div class="space-y-4 px-2"> 
            <p class="text-lg sm:text-xl text-gray-700 leading-relaxed line-clamp-4 group-hover:text-gray-800 transition-colors">
              {{feature.desc}}
            </p> 
          </div> 
        </p-card> 
    } 
  </div>
</div>
