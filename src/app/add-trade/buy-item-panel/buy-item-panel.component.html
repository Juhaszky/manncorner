<div
  class="col-card inventory-box flex flex-wrap flex-row items-start gap-2"
  #inventorySelector>
  <div
    class="item-box p-2 m-2 sm:h-24 sm:w-24 h-20 border border-slate-700"
    pTooltip="Add items..."
    tooltipPosition="bottom"
    (click)="onOpenItemEditor()"
    tabindex="0"
    (keydown)="onOpenItemEditor()">
    <img src="/assets/images/8333955.png" alt="" class="w-full h-full" />
  </div>
  @if (allItems) {
    <div class="flex flex-row flex-wrap gap-2 ">
      @for (item of selectedItems; track trackByFn($index, item)) {
        <div class="w-24">
          <app-item-container
            [item]="item"
            [canDelete]="true"
            [canModify]="true"
            [showQuantity]="true"
            (removeEmitter)="onRemoveItem(item)"
            (customizeEmitter)="onCustomizeItem(item)">
          </app-item-container>
        </div>
      }
    </div>
  }
</div>
<p-dialog
  header="Customize Item"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '80%', height: '80%' }">

  @if (editorVisible) {
    <app-item-editor
      [options]="allItems"
      (filterSearch)="handleFilterSearch($event)"
      (closeDialog)="onDialogClose()"
      (confirmSelecion)="this.itemSelectorFacade.onAddDefaultItem($event)">
    </app-item-editor>
  }
  @if (customizableItem) {
    <item-customizer
      (itemModified)="closeOnModification($event)"
      [details]="customizableItem">
    </item-customizer>
  }
</p-dialog>
