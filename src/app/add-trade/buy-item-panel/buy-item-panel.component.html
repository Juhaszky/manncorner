<div
  class="col-card inventory-box flex flex-wrap flex-row relative w-full h-full"
  #inventorySelector
  [class.justify-center]="mode !== 'allItems'">
  <div
    class="item-box p-2 m-2 sm:h-24 sm:w-24 h-20 w-20 border border-slate-700"
    matTooltip="Add items..."
    (click)="onOpenItemEditor()"
    tabindex="1"
    (keydown)="onOpenItemEditor()">
    <img src="/assets/images/8333955.png" alt="" class="img-fluid" />
  </div>
  <div class="flex flex-row flex-wrap w-full justify-between gap-2 p-2" *ngIf="allItems">
    <div *ngFor="let item of allItems" class="w-24">
      <app-item-container
        [item]="item"
        [mode]="mode"
        (removeEmitter)="onRemoveItem(0)">
      </app-item-container>
    </div>
  </div>
</div>
<p-dialog 
  header="Customize Item"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '80%', height: '80%' }">
  <app-item-editor (closeDialog)="onDialogClose()"></app-item-editor>
</p-dialog>
