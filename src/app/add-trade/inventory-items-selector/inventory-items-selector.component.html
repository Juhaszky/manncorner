<div class="col-card inventory-box flex flex-wrap flex-row relative w-full h-full" #inventorySelector
  [class.justify-center]="mode !== 'allItems'">
  <div class="flex flex-row flex-wrap w-full justify-between gap-2 p-2">
    <div *ngFor="let item of items" class="w-24">
      <app-item-container 
        [item]="item" 
        [mode]="mode" 
        (click)="onItemSelect(item)">

      </app-item-container>
    </div>
  </div>
</div>
