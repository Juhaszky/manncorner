<div class="sort-bar flex p-2.5">
  <button
    type="button"
    pButton
    label="Sort by.."
    icon="pi pi-chevron-down"
    (click)="menu.toggle($event)"
    class="flex items-center bg-gray-50 border border-gray-300
           text-gray-400 text-sm rounded-lg p-2.5 dark:bg-gray-800
           dark:border-gray-600 dark:placeholder-gray-400 dark:focus:ring-blue-500
           dark:focus:border-blue-500"
  >
  Sort
  </button>

  <p-menu #menu [popup]="true" [model]="items"></p-menu>
</div>
