<div class="row mt-4">
  <p-button (onClick)="setFavouriteItems()">Set favourite</p-button>
  <div class="flex flex-row flex-wrap gap-2">
    @for (item of selectedItems; track trackByFn($index, item)) {
      <div class="w-24">
        <app-item-container
          [item]="item"
          [canDelete]="true"
          [canModify]="true"
          (customizeEmitter)="onCustomizeItem(item)"
          [showQuantity]="true">
        </app-item-container>
      </div>
    }
  </div>
</div>
<div class="row mt-4">
  <div class="flex flex-row-reverse p-2">
    <app-action-bar [type]="'search-trade'"></app-action-bar>
  </div>
  <!-- <div class="col-card mb-3 p-1"> -->
  <div
    class="col-card inventory-box flex flex-wrap flex-row relative w-full h-full"
    #inventorySelector>
    <div class="flex flex-row flex-wrap w-full justify-center gap-2 p-2">
      @for (item of baseInventoryItems; track trackByFn($index, item)) {
        <div
          class="w-24">
          <app-item-container
            [item]="item"
            [disabled]="isItemDisabled(item)"
            (selectEmitter)="itemSelectorFacade.onAddFavouriteItem(item)"
            (click)="onItemSelect(item)">
          </app-item-container>
        </div>
      }
      @if (isLoading) {
        <div
          class="flex justify-center items-center w-full mt-4">
          <p-progress-spinner
            ariaLabel="Loading"
          styleClass="custom-spinner"></p-progress-spinner>
        </div>
      }
    </div>
  </div>
  <!-- <app-inventory-items-selector [mode]="'inventory'" [filter]="filterText">
</app-inventory-items-selector> -->
<!-- </div> -->
</div>
<p-dialog
  header="Customize Item"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '80%', height: '80%' }">

  @if (editorVisible) {
    <app-item-editor
      [options]="allItems"
      (filterSearch)="handleFilterSearch($event)"
      (confirmSelecion)="this.itemSelectorFacade.onAddSearchDefaultItem($event)"
      (closeDialog)="onDialogClose()">
    </app-item-editor>
  }
  <item-customizer
    (itemModified)="closeOnModification($event)"
    [details]="customizableItem">
  </item-customizer>
</p-dialog>
