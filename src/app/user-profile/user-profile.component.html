<div class="flex flex-col p-4 gap-4" *ngIf="userData">
  <div class="profile-data flex flex-row items-center gap-2">
    <img
      routerLink="userprofile"
      class="h-24 w-24 rounded-full"
      [src]="userData.avatarfull"
      alt="asd" />
    <div class="flex flex-row gap-2 h-8 items-center">
      <a [href]="data.link" target="_blank" *ngFor="let data of chipData">
        <p-chip [label]="data.label" styleClass="chip" />
      </a>
    </div>
  </div>
  <h1 class="text-3xl font-bold">{{ userData.personaname }}'s profile</h1>
  <div class="experience-box rounded-md border border-gray-600 p-6">
    <div class="title flex flex-wrap justify-between">
      <h2 class="text-lg sm:text-xl md:text-2xl lg:text-3xl">Experience</h2>
      <p>100/200</p>
    </div>
    <p-progressbar [value]="value" />
  </div>
  <div class="trade-box rounded-md border border-gray-600 p-6">
    <h2 class="text-2xl">Your trades (3)</h2>
    <div class="items flex flex-wrap w-full">
      <div
        *ngFor="let _ of [].constructor(3)"
        class="flex flex-wrap w-1/3 trade">
        <div
          *ngFor="let _ of [].constructor(3)"
          class="item-box p-2 m-2 sm:h-24 sm:w-24 h-20 hover:cursor-pointer border border-slate-700 rounded-lg relative z-0"></div>
        <div
          *ngFor="let _ of [].constructor(3)"
          class="item-box p-2 m-2 sm:h-24 sm:w-24 h-20 hover:cursor-pointer border border-slate-700 rounded-lg relative z-0"></div>
      </div>
    </div>
  </div>
  <div
    class="trade-url-box w-full max-w-xl mx-auto flex flex-col gap-4 rounded-md border border-gray-600 p-4 sm:p-6">
    <h3 class="text-xl sm:text-2xl font-semibold">Trade URL</h3>
    <p class="text-teal-500 text-sm sm:text-base">
      <a
        href="https://steamcommunity.com/my/tradeoffers/privacy#trade_offer_access_url"
        target="_blank"
        class="underline hover:text-teal-600 transition-colors duration-200"
        >Get your trade URL</a
      >
    </p>
    <p-floatlabel>
      <input
        [(ngModel)]="tradeUrl"
        pInputText
        id="over_label"
        autocomplete="off"
        class="w-full" />
      <label for="over_label">Your trade URL</label>
    </p-floatlabel>
    <p-button
      (click)="onSaveTradeUrl()"
      class="w-full sm:w-auto"
      label="Save Trade URL" />
  </div>
</div>
<p-toast position="bottom-right"/>
