<div class="flex min-h-screen w-full text-gray-700" *ngIf="tradeData">
  <div class="trade mt-3 p-3 w-full last:mb-5">
    <div class="trade-details">
      <div class="flex flex-row justify-between">
        <p class="flex items-center gap-2 w-50 p-0 m-0">
          <p-avatar [image]="tradeData.avatarPath" shape="circle" />
          <span class="user-name-text">{{ tradeData.username }}</span> wants to
          trade...
          <!-- <span matTooltip="{{ tradeData.postDate | date }}">{{
            tradeData.postDate | postDate
          }}</span> -->
        </p>
        <p
          class="w-50 text-end p-0 m-0 sm:text-sm text-xs font-black text-gray-700"
        >
          {{ tradeData.id }}
        </p>
      </div>
    </div>
    <div class="flex flex-wrap sm:flex-row flex-col w-full">
      <div
        class="col-card inventory-box flex flex-wrap flex-row relative w-full h-full"
        #inventorySelector>
        <div class="flex flex-row flex-wrap w-full gap-2 p-2">
          <div *ngFor="let item of tradeData.itemsFrom" class="w-24">
            <app-item-container [item]="item"> </app-item-container>
          </div>
        </div>
      </div>
      <!-- <div
        class="flex flex-row flex-wrap gap-2 p-2"
      >
        <app-item-container *ngFor="let item of tradeData.itemsFrom" [item]="item"></app-item-container>
      </div> -->
      <div class="arrow flex sm:items-center justify-center">
        <img
          class="h-24 hidden sm:block"
          src="/assets/images/arrow-right-01-512.webp"
          alt="Arrow"
        />

        <!-- Visible only on mobile -->
        <img
          class="h-24 block sm:hidden"
          src="/assets/images/Down-Arrow-PNG-Image.png"
          alt="Arrow for Mobile"
        />
      </div>
      <div
        class="col-card inventory-box flex flex-wrap flex-row relative w-full h-full"
        #inventorySelector>
        <div class="flex flex-row flex-wrap w-full gap-2 p-2">
          <div *ngFor="let item of tradeData.itemsTo" class="w-24">
            <app-item-container [item]="item"> </app-item-container>
          </div>
        </div>
      </div>
      <!-- <div
        class="items flex flex-1 flex-wrap sm:w-1/3 w-full overflow-hidden border-2 border-slate-700"
      >
      <app-item-container *ngFor="let item of tradeData.itemsTo" [item]="item"></app-item-container>
      </div> -->
    </div>
    <descrpition [canEdit]="false" [html]="description"></descrpition>
    <!-- <app-offer-item-panel></app-offer-item-panel> -->
    <!-- <app-offer-item-selector></app-offer-item-selector> -->
     <app-comments [tradeId]="tradeData.id" [comments]="tradeData.comments"></app-comments>
  </div>
</div>
