<div class="comment-container bg-slate-800 rounded border border-slate-700 p-4 mb-4">
  <div class="flex items-start">
    <img [src]="comment.owner.avatarPath" alt="Avatar" class="w-10 h-10 rounded-full mr-3" />
    <div class="flex-1">
      <div class="flex justify-between">
        <span class="text-lg font-semibold text-slate-50">{{ comment.owner.username }}</span>
        <span class="text-xs text-slate-400">{{ comment.createdAt | date:'medium' }}</span>
      </div>
      <div class="mt-1 text-slate-200">{{ comment.commentData }}</div>
      <div class="flex flex-row flex-wrap gap-2 p-2">
        <div *ngFor="let item of comment.itemsOffer" class="w-24">
          <app-item-container
            [item]="item"
            [canDelete]="false"
            [canModify]="false">
          </app-item-container>
        </div>
  </div>
      <button class="text-blue-400 hover:underline mt-2" (click)="toggleReplyForm()">
        Reply
      </button>

      <div *ngIf="showReplyForm" class="mt-2">
        <form (ngSubmit)="submitReply()">
          <textarea 
            [(ngModel)]="replyText" name="replyText" rows="2"
            placeholder="Write a reply..."
            class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-slate-100 mb-2 resize-none"></textarea>
          <div class="flex gap-2">
            <p-button type="submit" [disabled]="!replyText.trim()" label="Post Reply"></p-button>
            <button type="button" class="px-3 py-1 bg-slate-700 rounded" (click)="toggleReplyForm()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div *ngIf="comment.replies?.length" class="pl-6 mt-4 border-l-2 border-slate-600">
    <ng-container *ngFor="let reply of comment.replies">
      <app-comment
        [comment]="reply"
        (replyEmitter)="replyEmitter.emit($event)">
      </app-comment>
    </ng-container>
  </div>
</div>
