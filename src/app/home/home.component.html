<div class="container flex flex-col w-full pb-12 h-94">
  <div
    class="trade mt-3 p-3 sm:w-3/4 w-full last:mb-5 hover:cursor-pointer overflow-auto flex-grow"
    *ngFor="let trade of trades"
    (click)="selectTrade(trade.id)"
    (keydown)="selectTrade(trade.id)"
    tabindex="0"
  >
    <div class="trade-details">
      <div class="flex flex-row justify-between">
        <p class="w-50 p-0 m-0">
          <span class="user-name-text">{{ trade.username }}</span> wants to
          trade...
          <!-- <span matTooltip="{{ trade.postDate | date }}">{{
            trade.postDate | postDate
          }}</span> -->
        </p>
        <p
          class="w-50 text-end p-0 m-0 sm:text-sm text-xs font-black text-gray-700"
        >
          {{ trade.id }}
        </p>
      </div>
    </div>
    <div class="flex flex-wrap sm:flex-row flex-col w-full">
      <div
        class="flex flex-wrap flex-1 sm:w-1/3 w-full h-56 overflow-hidden border-2 border-slate-700"
      >

        <app-item-container *ngFor="let item of trade.itemsToSell" [item]="item"></app-item-container>
      </div>
      <div class="arrow flex sm:items-center justify-center">
        <img
          class="h-20 hidden sm:block"
          src="/assets/images/arrow-right-01-512.webp"
          alt="Arrow"
        />

        <!-- Visible only on mobile -->
        <img
          class="h-20 block sm:hidden"
          src="/assets/images/Down-Arrow-PNG-Image.png"
          alt="Arrow for Mobile"
        />
      </div>
      <div
        class="items flex flex-1 flex-wrap sm:w-1/3 w-full overflow-hidden border-2 border-slate-700"
      >
      <app-item-container *ngFor="let item of trade.itemsToBuy" [item]="item"></app-item-container>
      </div>
    </div>
  </div>
  <div class="paginator-wrapper">
    <p-paginator [first]="first" [rows]="rows" [totalRecords]="25" [rows]="25"></p-paginator>
  </div>
  <paginator
    class="absolute bottom-0"
    [tradeLength]="(totalTrades$ | async) || 0"
  >
  </paginator>
  <!-- <mat-spinner class="absolute top-full" *ngIf="loading"></mat-spinner> -->
</div>
