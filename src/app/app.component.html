<main class="dark:bg-gray-800 min-h-screen flex flex-col">
  <app-mobile-nav [isDrawerOpen]="isDrawerOpen"></app-mobile-nav>

  <div class="container-fluid w-full dark:bg-gray-800 flex-1 flex flex-col">
    <navbar (toggleDrawer)="isDrawerOpen = !isDrawerOpen"></navbar>

    <div class="flex-1">
      <router-outlet></router-outlet>
      <p-toast position="bottom-right" />
    </div>
    @if (activatedRoute.snapshot.firstChild?.routeConfig?.path === 'home') {
      <div class="paginator-wrapper">
        <app-loading-spinner ></app-loading-spinner>
        <p-paginator
          [first]="(first$ | async) ?? 0"
          [rows]="rows"
          [totalRecords]="(totalRecords$ | async) ?? 0"
          [showCurrentPageReport]="true"
          (onPageChange)="onPageChange($event)">
        </p-paginator>
      </div>
    }
    <footer class="bg-white border-t border-gray-200 py-2.5 dark:bg-gray-900 dark:border-gray-700">
      <div
        class="flex flex-wrap items-center justify-between max-w-screen-xl px-4 mx-auto">

        <a routerLink="/home" class="flex items-center">
          <span
            class="self-center text-xl font-semibold dark:text-white whitespace-nowrap">
            Mann<span id="titleEnding">corner</span>
          </span>
        </a>

        <div class="flex items-center">
          <ul class="flex flex-row items-center gap-6 text-sm font-medium text-gray-700 dark:text-gray-400">
            <li>
              <a
                routerLink="/about"
                class="hover:text-purple-700 dark:hover:text-white">
                About
              </a>
            </li>
            <li>
              <a
                routerLink="/terms"
                class="hover:text-purple-700 dark:hover:text-white">
                Terms
              </a>
            </li>
            <li>
              <a
                routerLink="/privacy"
                class="hover:text-purple-700 dark:hover:text-white">
                Privacy
              </a>
            </li>
            <li class="text-xs text-gray-500 dark:text-gray-500">
              © 2025 Manncorner
            </li>
          </ul>
        </div>
      </div>
    </footer>


  </div>

  <p-dialog
    header="Edit Profile"
    [modal]="true"
    [(visible)]="itemService.showItemDetails"
    [style]="{ width: '25rem' }"
    [baseZIndex]="10000">
    <!-- TODO: make item details for mobile -->
  </p-dialog>

  <p-contextmenu #globalContextMenu [model]="contextMenuItems" appendTo="body">
  </p-contextmenu>
</main>
